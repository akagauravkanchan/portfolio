<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 28px 24px 24px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .close-btn {
    position: absolute;
    top: 18px;
    right: 20px;
    background: none;
    border: none;
    font-size: 18px;
    color: #444;
    cursor: pointer;
    line-height: 1;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 20px 0;
    color: #111;
  }

  .field {
    position: relative;
    margin-bottom: 14px;
  }

  .field .asterisk {
    position: absolute;
    top: 8px;
    right: 12px;
    color: #111;
    font-size: 13px;
  }

  input, textarea {
    width: 100%;
    border: 1.5px solid #d8d8d8;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: #333;
    background: #fff;
    outline: none;
    font-family: inherit;
  }

  input::placeholder, textarea::placeholder {
    color: #b3b3b3;
  }

  input:focus, textarea:focus {
    border-color: #7fb2f0;
    box-shadow: 0 0 0 3px rgba(127,178,240,0.25);
  }

  textarea {
    resize: vertical;
    min-height: 110px;
  }

  .submit-btn {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .submit-btn:hover { background: #000; }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 14px;
    min-height: 18px;
  }

  .status-msg.success { color: #1a7f37; }
  .status-msg.error { color: #c0392b; }
</style>
</head>
<body>

<div class="card">
  <button class="close-btn" aria-label="Close" onclick="document.querySelector('.card').style.display='none'">✕</button>
  <h1>Contact</h1>

  <form id="contactForm">
    <div class="field">
      <input type="text" id="firstName" name="firstName" placeholder="First name" required>
      <span class="asterisk">*</span>
    </div>

    <div class="field">
      <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
      <span class="asterisk">*</span>
    </div>

    <div class="field">
      <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
      <span class="asterisk">*</span>
    </div>

    <div class="field">
      <input type="email" id="email" name="email" placeholder="Email" required>
      <span class="asterisk">*</span>
    </div>

    <div class="field">
      <textarea id="question" name="question" placeholder="Your question" required></textarea>
      <span class="asterisk">*</span>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      Submit <span>&#8594;</span>
    </button>

    <div class="status-msg" id="statusMsg"></div>
  </form>
</div>

<script>
  // ⚠️ Replace this with your own Google Apps Script Web App URL (see setup instructions).
  const SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  const form = document.getElementById("contactForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    statusMsg.textContent = "";
    statusMsg.className = "status-msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const data = {
      firstName: document.getElementById("firstName").value,
      lastName: document.getElementById("lastName").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      question: document.getElementById("question").value,
      timestamp: new Date().toISOString()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Apps Script web apps don't return CORS headers by default
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      // Because of no-cors mode we can't read the response,
      // so we optimistically assume success if no network error was thrown.
      statusMsg.textContent = "Thanks! Your message has been sent.";
      statusMsg.classList.add("success");
      form.reset();
    } catch (err) {
      statusMsg.textContent = "Something went wrong. Please try again.";
      statusMsg.classList.add("error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit <span>&#8594;</span>';
    }
  });
</script>

</body>
</html>
